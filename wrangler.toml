# Relais IA (Cloudflare Worker), déployé automatiquement par Cloudflare depuis la racine du dépôt.
# Le code est dans relay/src/index.js. La clé Anthropic n'est PAS ici : c'est le secret ANTHROPIC_API_KEY dans Cloudflare.
# Garder le même contenu que relay/wrangler.toml (sauf name et main).
name = "mon-equilibre-calorique"
main = "relay/src/index.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
# Ne pas publier les fichiers de l'appli : ce Worker ne sert que le relais.
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://lynalk.github.io,capacitor://localhost,https://localhost,http://localhost"
MODEL = "claude-opus-5-5"

[[ratelimits]]
name = "PHOTO_LIMIT"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 6
  period = 60
